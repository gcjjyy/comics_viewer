[package]
name = "comics-viewer"
version = "0.1.0"
description = "Desktop comic book viewer for ZIP comics on local folders and SSH (SFTP) servers"
authors = ["gcjjyy"]
license = "MIT"
repository = "https://github.com/gcjjyy/comics_viewer"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comics_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
zip = "9"
encoding_rs = "0.8"
lru = "0.19"
thiserror = "2"
sha1 = "0.11.0"
hex = "0.4.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.43", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
percent-encoding = "2"
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "4"
keyring = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
crc32fast = "1.5.6"
tempfile = "3.27.0"
